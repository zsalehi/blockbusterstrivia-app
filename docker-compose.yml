services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bbt}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here run once, on first start with an empty data volume
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bbt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bbt}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-BlockBusters <noreply@blockbusterstrivia.com>}
      REGISTRATION_NOTIFY_TO: ${REGISTRATION_NOTIFY_TO:-info@blockbusterstrivia.com}
      EMAIL_CONSOLE: ${EMAIL_CONSOLE:-false}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Unraid's own web UI uses port 80, so set HTTP_PORT=8480 there.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      WWW_ADDRESS: ${WWW_ADDRESS:-www.localhost}
      ROBOTS_TAG: ${ROBOTS_TAG:-all}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Home-server option: no open ports or port-forwarding needed.
  # Enable with: docker compose --profile tunnel up -d   (and SITE_ADDRESS=:80)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
