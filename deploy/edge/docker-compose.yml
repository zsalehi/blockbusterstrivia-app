# Shared reverse proxy for every site and app on the server.
# Lives at /srv/edge on the server. Each app joins the external `edge` network
# with a unique alias, and gets a file in sites/ that routes its domain to it.
#   docker network create edge           # once per server
#   docker compose up -d                 # first start
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile   # after editing sites/
name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./www:/srv/www:ro          # static sites: /srv/www/<domain>
      - caddy_data:/data           # certificates, keep this volume
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
